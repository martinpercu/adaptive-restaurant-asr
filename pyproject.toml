[project]
name = "ars"
version = "0.0.0"
description = "ARS — Adaptive Restaurant Speech: a self-improving bilingual (es+en) restaurant ASR system."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

# Core runtime deps (installed by `make setup`). Majors pinned per plan §0.1.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<21",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "soundfile>=0.12,<1",
    # torch and torchaudio must share a minor (ABI-coupled). 2.11.x is the matched pair.
    "torch>=2.11,<2.12",
    "torchaudio>=2.11,<2.12",
    "structlog>=24.1,<26",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",  # FastAPI multipart (WAV) uploads
    "faster-whisper>=1.0,<2",
    "silero-vad>=5.1,<6",
    "jiwer>=3.0,<4",
    "rapidfuzz>=3.9,<4",
    "jellyfish>=1.0,<2",
    "pyyaml>=6.0,<7",
]

[project.scripts]
ars = "ars.__main__:main"

[dependency-groups]
# Heavier groups land with the phases that need them (installed via `make setup-all`).
train = [
    "transformers>=4.44,<5",
    "peft>=0.12,<1",
    "datasets>=2.20,<4",
    "accelerate>=0.33,<2",
    "ctranslate2>=4.3,<5",
]
preprocess = [
    "noisereduce>=3.0,<4",
    "deepfilternet>=0.5,<1",
]
separation = [
    "demucs>=4.0,<5",
]
flywheel = [
    "prefect>=2.19,<4",
    "anthropic>=0.34,<1",
    "openai>=1.40,<2",
]
tts = [
    "piper-tts>=1.4,<2",  # build-time TTS corpus/fixtures (scripts/tts_corpus.py)
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.5,<1",
    "httpx>=0.27,<1",  # FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ars"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "acceptance: phase exit-gate tests (run via `make gate PHASE=N`)",
    "slow: real model sizes / training smoke / latency budgets",
    "gpu: requires a GPU",
    "network: performs network downloads",
]
addopts = "-ra"
