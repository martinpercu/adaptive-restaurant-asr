# ARS root config — validated by ars.config.Settings (pydantic-settings, extra="forbid").
# Env overrides: ARS_ prefix, nested via double underscore (e.g. ARS_VAD__MIN_SPEECH_RATIO=0.25).
# No module reads YAML directly; everything goes through Settings.

seed: 1337

paths:
  data: data
  models: models
  reports: reports
  configs: configs
  db: data/db/ars.db
  noise_taxonomy: configs/noise_taxonomy.yaml

vad:
  backend: silero
  min_speech_ratio: 0.2       # below this -> return empty, never call Whisper
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 100

asr:
  backend: faster-whisper
  model_size: small           # CI uses tiny (test override); prod small/medium
  device: cpu                 # cpu | cuda
  compute_type: int8          # int8 on cpu, float16 on gpu
  beam_size: 5
  condition_on_previous_text: false
  no_speech_threshold: 0.6
  log_prob_threshold: -1.0
  temperature: [0.0, 0.2, 0.4]
  initial_prompt_max_tokens: 200   # Whisper truncates prompts at 224
  guard:
    no_speech_prob_max: 0.85
    avg_logprob_min: -1.0
    repetition_ngram: 3
    repetition_max_repeats: 3

preprocess:
  enabled: true
  mode: log_only              # off | log_only | active (production-safe rollout default)
  classifier: cnn
  classifier_path: models/noise_classifier/latest/model.pt
  policy_path: configs/mitigation_policy.yaml   # GENERATED by phase 3
  min_confidence: 0.6         # below this the classifier predicts clean (no mitigation)

keydetector:
  enabled: true
  mode: log_only              # replace | log_only
  rules_dir: configs/rules
  menu_dir: configs/menu
  fuzzy_threshold: 0.85
  max_false_correction_rate: 0.005

training:
  base_model: whisper-medium
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  epochs: 3
  learning_rate: 1.0e-4
  batch_size: 8
  min_noisy_wer_rel_improvement: 0.15
  max_clean_wer_rel_regression: 0.02
  max_keyword_recall_drop: 0.01

judge:
  provider: anthropic         # anthropic | openai
  model: claude-sonnet-5
  batch: true
  calibration_min_agreement: 0.90
  calibration_min_items: 100

flywheel:
  cadence: weekly
  low_confidence_logprob: -0.8
  review_queue_only_doubtful: true

eval:
  ndi_weights:
    d_wer: 0.5
    d_ker: 0.4
    hallucination: 0.1
  wer_decimals: 3
  snr_tolerance_db: 0.5

ingest:
  store_audio: true
  telemetry_dir: data/telemetry

storage:
  backend: local              # local | s3
  # s3_* fields come from env (ARS_S3_ENDPOINT etc.); unset -> local

security:
  auth_enabled: true
  tokens: {}                  # store_id -> bearer token (set per deployment via env/secret)
  rate_limit_per_min: 120     # per store, never global (one broken kiosk must not starve fleet)
  max_upload_s: 60.0
  scrub_logs: true            # never log full transcripts at INFO (debug envs only: false)

ops:
  retention_days: 90          # raw audio soft-deleted after this; transcripts/metrics kept
  webhook_url: ""             # optional alert sink (no vendor lock)
  psi_input_drift: 0.2
  noise_share_multiplier: 2.0
  rule_storm_multiplier: 3.0
  judge_quality_max: 0.15
